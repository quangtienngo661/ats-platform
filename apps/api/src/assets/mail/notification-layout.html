<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F5F5F7; padding: 40px 10px;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 580px; background-color: #FFFFFF; border-radius: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); overflow: hidden; border: 1px solid #E5E5EA;">
          <tr>
            <td style="height: 6px; background-color: #0071E3;"></td>
          </tr>
          <tr>
            <td style="padding: 40px 35px 35px 35px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 30px;">
                <tr>
                  <td align="center">
                    <span style="font-size: 24px; font-weight: 700; color: #1D1D1F; letter-spacing: -0.03em;">Talent<span style="color: #0071E3;">AI</span></span>
                  </td>
                </tr>
              </table>
              <h1 style="margin: 0 0 20px; font-size: 20px; font-weight: 700; color: #1D1D1F; line-height: 1.3;">{{title}}</h1>
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="font-size: 14px; color: #6E6E73; line-height: 1.6;">
                    {{content}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color: #F5F5F7; padding: 20px 35px; border-top: 1px solid #E5E5EA; text-align: center;">
              <p style="margin: 0; font-size: 11px; color: #8E8E93; line-height: 1.4;">Đây là email tự động, vui lòng không trả lời.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
