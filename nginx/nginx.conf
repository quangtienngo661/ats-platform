# 📦 HỘP 1: Tầng toàn cục (Main/Global Context)
# Nơi quy định quyền lực tối cao của hệ thống (Ví dụ: CPU, User chạy ngầm, Logs chung)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 📦 HỘP 2: Tầng quản lý kết nối (Events Context)
    # Nơi cấu hình kỹ thuật cho các "vệ sĩ" (Worker) xử lý hàng đợi mạng.
    worker_connections 1024;
}

http {
    # 📦 HỘP 3: Tầng xử lý giao thức Web (HTTP Context)
    # Đây là "Phòng kinh doanh Web". Tất cả những gì liên quan đến HTTP/HTTPS, 
    # định tuyến, chia cổng, bảo mật web... đều phải nằm ôm trọn trong hộp này.
    include /etc/nginx/mime.types;

    # Upsteam ~ load balancing layer
    server_tokens off;
    upstream frontend_service { server web:3000; }

    upstream backend_service { server api:5000; }

    server {
        listen 80;
        listen [::]:80;
        server_name talentinterviewer.app www.talentinterviewer.app;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name talentinterviewer.app;

        ssl_certificate /etc/letsencrypt/live/talentinterviewer.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/talentinterviewer.app/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 15M;

        # SSL Cache để tăng tốc độ handshake lần sau
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Tiêu chuẩn OWASP)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https: ws: wss;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://frontend_service;    
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://backend_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }   

        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}