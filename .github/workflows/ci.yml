name: CI

on: 
  pull_request:
    branches: [ dev ]

permissions: 
  actions: read
  contents: read
  pull-requests: read

concurrency: 
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
  
jobs: 
  validate:
    name: Validate affected projects
    runs-on: ubuntu-latest

    strategy: 
      matrix: 
        node-version: [24]

    env:
      NODE_ENV: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with: 
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with: 
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Print versions
      run: |
        node -v
        npm -v
        git status
        git branch -a

    - name: Install dependencies
      run: npm ci
      
    - name: Set Nx base and head SHAs
      uses: nrwl/nx-set-shas@v5

    - name: Generate Prisma Client
      run: npx prisma generate --schema=libs/backend/database/prisma/schema.prisma
      env:
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

    - name: Lint affected projects
      run: npx nx affected -t lint

    - name: Validate frontend types and lint
      run: |
        npm run typecheck:web
        npm run lint:web

    - name: Test backend units
      run: npx nx test api --runInBand --silent

    - name: Test frontend behavior and session policy
      run: npm run test:web

    - name: Cache Next.js build cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/apps/web/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
 
    # next build requires NODE_ENV=production; the job-level NODE_ENV=test
    # (needed by jest) otherwise makes React crash while prerendering the
    # synthetic error pages (/_not-found, /_global-error).
    - name: Build affected projects
      run: npx nx affected -t build
      env:
        NODE_ENV: production

  web-e2e:
    name: Frontend journeys with isolated API fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
      WEB_E2E_BASE_URL: http://localhost:3001
      WEB_E2E_API_URL: http://localhost:55000/api
      API_INTERNAL_URL: http://localhost:55000/api
      WEB_E2E_ADMIN_EMAIL: admin@ats.local
      WEB_E2E_ADMIN_PASSWORD: Admin@123
      WEB_E2E_CANDIDATE_EMAIL: candidate-e2e@ats.test
      WEB_E2E_CANDIDATE_PASSWORD: Candidate@123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the dedicated test stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 180
      - name: Prepare sample accounts and organization
        run: |
          node apps/web/e2e/support/prepare-local.mjs
          node -e "const f=require('./docs/tasks/test-defect-fixes/results/local-fixture.json');require('fs').appendFileSync(process.env.GITHUB_ENV,'WEB_E2E_ORGANIZATION_ID='+f.organizationId+'\n')"
      - name: Run browser journeys
        run: npm run test:e2e:web
      - name: Save failure diagnostics
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color > test-stack.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-e2e-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
            test-stack.log
          retention-days: 7
      - name: Clean up the dedicated test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
