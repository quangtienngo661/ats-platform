version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: ats-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tienngo@@123
      POSTGRES_DB: ats-db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: ats-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

